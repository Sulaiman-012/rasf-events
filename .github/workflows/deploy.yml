# Deploys the platform to Cloudflare (free plan) on every push to main, or manually from the Actions tab.
# Needs 4 repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SETUP_KEY, SESSION_SECRET.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upload secrets and deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            SETUP_KEY
            SESSION_SECRET
          # Tables are created by the Worker itself on first request (src/lib.ts ensureSchema),
          # so the token only needs "Workers Scripts: Edit".
          command: deploy
        env:
          SETUP_KEY: ${{ secrets.SETUP_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
